# G1 scenario set v2 - RELIABILITY FIX (Post-L1). Same schema as scenarios.yaml; scenarios.yaml is UNCHANGED so the original
# H1/I1 datasets stay exactly reproducible.
#
# Why v2 exists (all measured, see README 'Reliability fix'): the original generator (1) never produced empty or stationary
# zones and never produced undefined movement metrics after warm-up, (2) tied low speed to danger (P(stationary | SAFE) = 0),
# and (3) extrapolated linear trends for the whole 900 s (up to 5,144 people in 50 m2).
#
# Changes: original six scenarios keep their parameters but gain plateaus (max_density / min_speed_px_s) equal to where each
# stopped within its ORIGINAL 120 s horizon; 13 new scenarios cover the missing operating states, with danger driven by DENSITY
# independently of speed. New labels follow G1's EXISTING density regime (SAFE ~0.5, LOW ~0.8, MODERATE ~1.0-1.2, HIGH ~1.5+,
# CRITICAL >= 2.0 people/m2). These labels are PROVISIONAL ENGINEERING ASSUMPTIONS, not validated safety thresholds.
# Movement semantics copy features/crowd_metrics.py: no people -> movement metrics undefined; standing people -> speed 0.0 is a
# VALID zero while direction is undefined.
duration_s: 900.0
sample_interval_s: 1.0
zone_id: synthetic_zone
realizations_per_scenario: 6
realizations_per_transition: 4
base_seed: 20260
density_growth_threshold: 0.05
train_frac: 0.7
val_frac: 0.15
test_frac: 0.15
row_stride: 3
split_strategy: stratified
dataset_version: synthetic_v2
